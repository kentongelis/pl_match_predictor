# Shared config for Go and Python. All tunables live here, not in code.

db:
  path: data/pl.duckdb

paths:
  raw_dir: data/raw
  team_names: data/mappings/team_names.csv
  sql_dir: sql
  models_dir: models

seasons:
  # Start year of each season: 2014 means 2014-15.
  first: 2014
  current: 2026

sources:
  footballdata:
    # {code} becomes a 4-digit season code, e.g. 2014-15 -> "1415"
    url_template: "https://www.football-data.co.uk/mmz4281/{code}/E0.csv"
  clubelo:
    # {club} is ClubElo's URL name; each call returns that club's full rating history
    url_template: "http://api.clubelo.com/{club}"
    # Every club in the league since seasons.first. Add promoted clubs here.
    clubs: [
      Arsenal, AstonVilla, Bournemouth, Brentford, Brighton, Burnley, Cardiff,
      Chelsea, Coventry, CrystalPalace, Everton, Fulham, Huddersfield, Hull,
      Ipswich, Leeds, Leicester, Liverpool, Luton, ManCity, ManUnited,
      Middlesbrough, Newcastle, Norwich, Forest, QPR, SheffieldUnited,
      Southampton, Stoke, Sunderland, Swansea, Tottenham, Watford, WestBrom,
      WestHam, Wolves,
    ]

http:
  timeout_seconds: 30
  max_retries: 3
  backoff_initial_ms: 500
  rate_limit_ms: 1000      # wait between requests to the same host

features:
  rolling_windows: [5, 10]

elo:
  initial: 1500 # every team's rating on day one, and the league mean
  k: 20 # how far one result moves the ratings
  home_advantage: 60 # rating points added to the home side
  season_regression: 0.2 # share of each team's gap to `initial` removed every summer
  goal_margin: true


simulation:
  iterations: 100000
  workers: 8
  seed: 42

model:
  current: null            # set once a model is promoted
  walk_forward_test_seasons: 5
